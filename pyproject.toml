[tool.poetry]
name = "chatbot"
version = "0.1.0"
description = "My custom Azure OpenAI chatbot"
authors = ["rutk94"]

[tool.poetry.dependencies]
python = "^3.10"
openai = "^1.66.3"
tiktoken = "^0.9.0"
python-dotenv = "^1.0.1"
ruff = "^0.11.7"
mypy = "^1.15.0"
pytest = "^8.3.5"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
extend-select = ["C4", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.mypy]
allow_redefinition = true
disable_error_code = ["return", "import-untyped"]
